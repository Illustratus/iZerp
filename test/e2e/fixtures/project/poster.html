<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture project</title>
  <!-- A real project ships its own copy of the library next to this file.
       The fixture borrows the container's so the test folder stays two files. -->
  <link rel="stylesheet" href="/assets/izerp-lib.css">
  <style>
    html, body { margin: 0; background: #0e0c0a; color: #f3ecda;
                 font-family: system-ui, sans-serif; }
    .card { position: absolute; width: 1600px; height: 900px; padding: 80px;
            box-sizing: border-box; background: #171310;
            border: 1px solid rgba(198,154,76,0.25); }
    h1 { font-size: 96px; margin: 0; }
  </style>
</head>
<body>
  <div class="card" style="left:200px;top:200px"><h1>One</h1></div>
  <div class="card" style="left:2000px;top:200px"><h1>Two</h1></div>
  <script src="/assets/izerp-lib.js" data-slides="slides.izerp" data-storage-key="fixture-project"></script>
</body>
</html>

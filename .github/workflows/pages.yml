name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site (the showcase index.html + library + assets)
        uses: actions/upload-pages-artifact@v3
        with:
          # The demo is static: index.html loads izerp-lib.js/.css directly, so
          # the whole repo checkout is the site (node_modules isn't installed here).
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
